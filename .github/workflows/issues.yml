name: Issue closer

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue to check against the existing contribution rule
        type: number
        required: true

permissions:
  contents: read
  issues: write

jobs:
  autoclose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check issue template
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        with:
          script: |
            const issue_number = Number(process.env.ISSUE_NUMBER);
            if (!Number.isSafeInteger(issue_number) || issue_number < 1) {
              throw new Error('A positive issue number is required');
            }
            const params = { ...context.repo, issue_number };
            const { data: issue } = await github.rest.issues.get(params);
            if (issue.pull_request) {
              throw new Error('This workflow only handles issues');
            }
            if (issue.state !== 'open' || /.*guidelines for Contributing.*/.test(issue.body || '')) {
              return;
            }
            await github.rest.issues.createComment({
              ...params,
              body: 'Esta issue foi fechada automaticamente pela regra de contribuição existente: o corpo precisa conter "guidelines for Contributing". Edite a descrição e reabra a issue após adequá-la.'
            });
            await github.rest.issues.update({ ...params, state: 'closed' });
