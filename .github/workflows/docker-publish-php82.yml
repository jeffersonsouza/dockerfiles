name: PHP 8.2 with NGINX

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested image (master or release tags only)
        type: boolean
        default: true
  push:
    branches: [master, develop]
    tags: ["v*.*.*"]
    paths:
      - "new/8.2-fpm/**"
      - ".github/workflows/docker-publish-php82.yml"
      - "new/nginx/**"
      - "new/php/**"
      - "new/.dockerignore"
      - ".github/scripts/**"
  pull_request:
    branches: [master, develop]
    paths:
      - "new/8.2-fpm/**"
      - ".github/workflows/docker-publish-php82.yml"
      - "new/nginx/**"
      - "new/php/**"
      - "new/.dockerignore"
      - ".github/scripts/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: jeffersonsouza/php
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
  PHP_SERIES: "8.2"
  DOCKERFILE: new/8.2-fpm/Dockerfile

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and smoke test both architectures
        shell: bash
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --pull --no-cache \
              --platform "$platform" \
              --file "$DOCKERFILE" \
              --tag "php-smoke:$PHP_SERIES" \
              --load ./new
            bash .github/scripts/smoke-test-php.sh "php-smoke:$PHP_SERIES" "$PHP_SERIES" 256m 1
            bash .github/scripts/smoke-test-php.sh "php-smoke:$PHP_SERIES" "$PHP_SERIES" 512m 2
          done

      - name: Log into Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=8.2-nginx

      - name: Build and push Docker image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./new
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
