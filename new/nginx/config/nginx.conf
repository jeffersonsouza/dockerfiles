load_module modules/ngx_http_headers_more_filter_module.so;
load_module modules/ngx_http_cache_purge_module.so;
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

user                             www-data;
worker_processes                 auto;

# run nginx in foreground
# daemon off;

pid                              /var/run/nginx.pid;
worker_rlimit_nofile             8192;
events {
    worker_connections           1024;
}

http {
    include                      /etc/nginx/mime.types;
    default_type                 application/octet-stream;

    log_format                   main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent $request_length "$http_referer" "$http_user_agent" $request_time $upstream_response_time "$http_x_forwarded_for"';

    #a new log format for detecting bad bots.
    log_format                   blocked '$time_local: Blocked request from $http_x_real_ip $request';

    # real_ip must only be configured for trusted proxy networks.
    log_format                   specialLog '$remote_addr - $remote_user - $upstream_cache_status [$time_local]  '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" $request_time $upstream_response_time';

    server_tokens                off;

    client_header_timeout        15s;
    client_body_timeout          60s;
    send_timeout                 60s;
    keepalive_timeout            65;
    keepalive_requests           1000;
    sendfile                     on;
    tcp_nopush                   on;
    tcp_nodelay                  on;
    reset_timedout_connection    on; # allows the server to close the connection after a client stops responding.

    client_body_buffer_size      128k;
    client_max_body_size         100m;
    client_header_buffer_size    1k;
    large_client_header_buffers  4 16k;
    output_buffers               1 32k;
    postpone_output              1460;

    proxy_connect_timeout        300;
    proxy_send_timeout           300;
    proxy_read_timeout           300;
    proxy_buffer_size            16k;
    proxy_buffering              on;
    proxy_buffers                16 16k;

    # Session
    ssl_session_tickets off;

    # TLS
    ssl_protocols TLSv1.3;

    # Resolvers
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Gzip Settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 250;
    gzip_types image/svg+xml text/plain text/css application/json application/javascript application/x-javascript text/javascript text/xml application/xml application/xml+rss;

    # Brotli Settings
    brotli on;
    brotli_comp_level 6;
    brotli_types text/xml image/svg+xml application/x-font-ttf image/vnd.microsoft.icon application/x-font-opentype application/json font/eot application/vnd.ms-fontobject application/javascript font/otf application/xml application/xhtml+xml text/javascript  application/x-javascript text/plain application/x-font-truetype application/xml+rss image/x-icon font/opentype text/css image/x-win-bitmap;

    open_file_cache              max=1000 inactive=20s;
    open_file_cache_valid        30s;
    open_file_cache_min_uses     5;
    open_file_cache_errors       off;

    # Add stdout logging
    error_log /dev/stdout info;
    access_log /dev/stdout specialLog;

    # Write temporary files to /tmp so they can be created as a non-privileged user
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp_path;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # FastCGI cache config
    fastcgi_cache_path /usr/share/nginx/fastcgi_cache levels=1:2 keys_zone=phpcache:8m max_size=256m inactive=10m use_temp_path=off;
    fastcgi_cache_key "$scheme$host$request_uri";
    fastcgi_cache_use_stale off;

    include /etc/nginx/http.d/default.conf;
}
