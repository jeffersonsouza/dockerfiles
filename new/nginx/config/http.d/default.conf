include /etc/nginx/security/lists/blocked_bots.conf;
include /etc/nginx/security/lists/globalblacklist.conf;

map $sent_http_content_type $expires {
    default                 off;
    text/html               epoch;
    text/css                30d;
    application/javascript  30d;
    font/woff2              max;
    font/woff               max;
    image/x-icon            max;
    application/font-woff2  max;
}

server {
    listen   80; ## listen for ipv4; this line is default and implied
    listen   [::]:80 default ipv6only=on; ## listen for ipv6

    include /etc/nginx/http.d/variables.conf;

    root $main_root_path;
    index index.php index.html;

    # Make site accessible from http://localhost/
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-FastCGI-Cache $upstream_cache_status always;

    location ~ ^/purge(/.*)$ {
        if ($request_method != PURGE) { return 405; }
        allow 127.0.0.1;
        allow ::1;
        deny all;
        fastcgi_cache_purge phpcache "$scheme$host$1$is_args$args";
    }

    # Check these before PHP and static-file locations.
    location ~ /\. {
        log_not_found off;
        deny all;
    }

    location ~* (?:^|/)(?:Dockerfile[^/]*|docker-compose[^/]*\.ya?ml|compose\.ya?ml|composer\.(?:json|lock)|package(?:-lock)?\.json|yarn\.lock|pnpm-lock\.yaml)$ {
        deny all;
    }

    include /etc/nginx/security/block-injections.conf;
    include /etc/nginx/http.d/custom.conf;
    #include /etc/nginx/http.d/php-fpm.conf;

    # Never serve PHP source when PHP is disabled or a suffix is unsupported.
    location ~* \.(?:php[0-9]*|phar|phtml)(?:$|[./~]) { return 404; }

    location / {
        # try to serve file directly, fallback to index.php
        # try_files $uri /index.php$is_args$args;
        try_files $uri $uri/ /index.php?$args;
    }

    # Block bots
    if ($blocked_bots = 1) { return 444; }
    if ($bad_bot = 3) { return 444; }
    if ($bad_words = 3) { return 444; }
    if ($bad_referer = 1) { return 444; }

    error_page 404 /404.html;

    location = /404.html {
        root /var/www/errors;
        internal;
    }

    location ^~ /ngd-style.css {
        alias /var/www/errors/style.css;
        access_log off;
        log_not_found off;
    }

    location ^~ /ngd-sad.svg {
        alias /var/www/errors/sad.svg;
        access_log off;
        log_not_found off;
    }

    location ~* \.(jpg|jpeg|gif|css|png|js|ico|html)$ {
        access_log off;
        log_not_found off;

        expires max;
    }

}
