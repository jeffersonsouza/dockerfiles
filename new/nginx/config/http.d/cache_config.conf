fastcgi_cache phpcache;
fastcgi_cache_bypass $http_authorization $http_cookie;
fastcgi_no_cache $http_authorization $http_cookie $upstream_http_set_cookie;
# Cache only when the application supplies an explicit freshness lifetime.
fastcgi_cache_valid 200 301 302 0;
fastcgi_cache_min_uses 1;
# This location also serves no-store responses; cache locks would stall them.
fastcgi_cache_lock off;
